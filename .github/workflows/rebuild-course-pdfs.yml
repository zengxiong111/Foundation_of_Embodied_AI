name: Rebuild and verify bilingual course PDFs

on:
  push:
    branches:
      - main
      - course/rtc-action-chunking-20261018
      - docs/git-two-track-2026-10-18
    paths:
      - 'md/**'
      - 'materials.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rebuild-course-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-course-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: package-lock.json

      - name: PDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fontconfig fonts-noto-cjk
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.7' 

      - name: Synchronize bilingual source references
        run: npm run sync

      - name: Unit tests
        run: npm test

      - name: Rebuild changed Git chapter PDFs
        run: npm run build -- git

      - name: Validate PDFs, mathematical layout and manifest hashes
        run: npm run check

      - name: Generate Chinese and English complete course books
        run: python scripts/merge_collections.py

      - name: Validate course books and counted PDF outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pymupdf
          config = json.loads(Path('materials.json').read_text())
          assert len(config['topics']) == 14
          chapter_pdfs = [Path(t['documents'][l]['pdf']) for t in config['topics'] for l in ('zh', 'en')]
          assert len(chapter_pdfs) == 28 and all(f.is_file() for f in chapter_pdfs)
          for lang, name in [('zh','Chinese'),('en','English')]:
              p = Path(f'books/Foundation_of_Embodied_AI_Complete_{name}.pdf')
              with pymupdf.open(p) as book:
                  total = 2 + sum(len(pymupdf.open(t['documents'][lang]['pdf'])) for t in config['topics'])
                  assert len(book) == total
                  assert len(book[1].get_links()) >= 14
              print(lang, 'book verified:', p, 'pages:', total)
          PY

      - name: Commit validated course outputs
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md/ VERSIONS.md VERSIONS.zh-CN.md pdf/ books/
          if git diff --cached --quiet; then
            echo "No regenerated changes."
          else
            git commit -m "Rebuild 26 bilingual chapters and complete course PDFs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload verified chapter and book files
        uses: actions/upload-artifact@v4
        with:
          name: embodied-course-28-pdfs-and-books
          path: |
            pdf/*.pdf
            books/*.pdf
          if-no-files-found: error
          retention-days: 7
