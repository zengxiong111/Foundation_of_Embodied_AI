name: Rebuild and verify bilingual course PDFs

on:
  push:
    branches:
      - main
      - course/rtc-action-chunking-20261018
    paths:
      - 'md/**'
      - 'materials.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rebuild-course-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-course-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: package-lock.json

      - name: PDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fontconfig fonts-noto-cjk
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Synchronize bilingual source references
        run: npm run sync

      - name: Unit tests
        run: npm test

      - name: Rebuild all 28 chapter PDFs
        run: npm run build

      - name: Validate PDFs, mathematical layout and manifest hashes
        run: npm run check

      - name: Commit validated course outputs
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md/ VERSIONS.md VERSIONS.zh-CN.md pdf/
          if git diff --cached --quiet; then
            echo "No regenerated changes."
          else
            git commit -m "Rebuild bilingual chapter PDFs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload verified chapter PDFs
        uses: actions/upload-artifact@v4
        with:
          name: embodied-course-28-chapter-pdfs
          path: |
            pdf/*.pdf
          if-no-files-found: error
          retention-days: 7
